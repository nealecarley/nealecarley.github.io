<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Art Showcase</title>
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <h1>Neale's Weekly Art Showcase</h1>
        </div>
    </header>
    
    <main>
        <div class="container">
            <!-- Week Navigation -->
            <div class="week-navigation">
                <button id="prev-week" class="nav-button">← Previous</button>
                <div id="week-indicator" class="week-indicator">Week 1 of 11</div>
                <button id="next-week" class="nav-button">Next →</button>
            </div>
            
            <!-- Artwork Display -->
            <div id="artwork-container" class="artwork-container">
                <!-- Artwork will be inserted here by JavaScript -->
                <div class="loading">Loading artwork...</div>
            </div>
            
            <!-- Language Toggle -->
            <div class="language-toggle">
                <button class="language-button active" data-language="en">English</button>
                <button class="language-button" data-language="zh">中文</button>
            </div>
            
            <!-- Story Display -->
            <div id="story-container" class="story-container">
                <!-- Story will be inserted here by JavaScript -->
                <div class="loading">Loading story...</div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Neale's Art Showcase. All rights reserved.</p>
        </div>
    </footer>

    <script src="src/js/app.js"></script>
</body>
</html>
